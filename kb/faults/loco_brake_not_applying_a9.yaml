# ─────────────────────────────────────────────────────────────────────────────
# Fault: Loco brake is not applying through A9
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 9, §9.07, p.159 (a–c).
# Mechanism: three plain steps (PVEF, C3W isolating COC, BC1/BC2 COCs). No TLC line →
# unresolved is the engine default (batch 4 decision 5, flagged).
# STATUS: encoded 2026-09-17 (batch 4) — structure accepted and judgement calls confirmed by the user 2026-09-17.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: Loco_brake_not_applying_A9
aliases:
  - "loco brake not applying through A9"
  - "loco brake not applying with A9"
  - "loco brakes not applying through A9"
  - "loco brakes not applying with A9"
  - "loco brake is not applying through A9"
  - "A9 not applying loco brake"
  - "no loco brake with A9"
  - "loco brake not coming with A9"
  - "loco brake not applied by A9"
precedence: 1
listed_as: "pneumatic failures (RS / MR / BP / FP / BP drop / AFI / loco brakes)"
config_dependency: none
type_dependency: none
presenting_signs:
  - "Loco brake does not apply along with the A9 (automatic brake) application"

combination_rules: []
route_rules: []

steps:
  # (a)
  - id: operate_pvef_1_2_times
    text: "Operate PVEF 1 or 2 times and try (ensure PVEF should not be in pressed condition)."
    gate: null
    source: "§9.07(a), p159"

  # (b)
  - id: check_c3w_isolating_coc_normalise_if_isolated
    text: >-
      Even if loco brake is not applied by A9, check C3W valve isolating COC. If it is
      isolated, normalise the same and try.
    gate: null
    source: "§9.07(b), p159"

  # (c)
  - id: ensure_bc1_bc2_cocs_open
    text: "Ensure BC1 and BC2 cocs are in open condition."
    gate: null
    source: "§9.07(c), p159"

terminal_actions:
  resolved: "resume traction with the loco brake applying through A9"
  unresolved: "contact TLC for advice"          # engine default: §9.07 ends without a TLC line (flagged)

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.9, §9.07, p.159"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
