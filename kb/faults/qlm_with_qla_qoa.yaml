# ─────────────────────────────────────────────────────────────────────────────
# Fault: QLM acted along with QLA or QOA
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 6 "DJ Tripping through Safety Relays", §6.1.3, printed pp.85–86.
# This is the reroute target of qlm_dropped.yaml's second combination rule.
# §6.1.3: "Troubleshoot for both QLM and QLA/QOA." (a) follows §6.1.1 for QLM.
# STATUS: encoded 2026-09-15 — pending human confirmation (see HANDOFF).
# ─────────────────────────────────────────────────────────────────────────────
fault_id: QLM_with_QLA_QOA
aliases:
  - "QLM with QLA"
  - "QLM with QOA"
  - "QLM along with QLA"
  - "QLM along with QOA"
  - "QLM and QLA"
  - "QLM and QOA"
  - "QLM acted along with QLA or QOA"
config_dependency: none            # §6.1.3 lists ARNO among the aux equipment but does not branch on fitment
presenting_signs:
  - "DJ / VCB tripped"
  - "QLM target dropped together with QLA or QOA"

combination_rules: []              # §6.1.3(d) covers 'with other relays or alone'

steps:
  # §6.1.3(a): "For QLM above said procedure in 6.1.1 to be followed." — same ids as
  # qlm_dropped.yaml so claims carry over on reroute.
  - id: check_ht2_compartment
    text: >-
      Check the HT-2 compartment for smoke, burning smell, fire, high temperature
      and oil splashes from the transformer explosion vent, from underneath the
      loco via the vent pipe, and from the GR safety valve.
    gate: null
    source: "§6.1.3(a) → §6.1.1(a), p83–84"

  - id: check_oil_levels
    text: "Check TFP and GR oil level for any abnormal increase."
    gate: null
    source: "§6.1.3(a) → §6.1.1(b), p84"

  - id: check_arc_chutes_and_terminals
    text: >-
      Check CGR-1/CGR-2/CGR-3 arc chutes, RGR and RPGR for red-hot condition;
      check TFR terminals, A33/A0/A34 bushings, HT cable, TFILM, TFSPM, and oil
      leakage from breathers, transformer drain plug and oil trap box for any
      abnormality (smell, smoke, fire).
    gate: null
    on_abnormality: "Use fire extinguisher; ask for relief engine."   # §6.1.1(c) — (c)'s own consequence
    finding_key: arc_chute_terminal_abnormality
    source: "§6.1.3(a) → §6.1.1(c), p84"

  # §6.1.3(b): auxiliary power circuit — isolate-then-reset consequence.
  - id: check_auxiliary_power_circuit
    text: >-
      If everything is normal in the feeding power circuit, check the auxiliary
      power circuit — ARNO, the 11 auxiliary motors, RCAPTFWA and CAPTFWA, CHBA,
      a0/a1 terminals, cab heaters, TFVT, C118, R118, Q30, RQ30, UA1, UA2, EM
      contactors, HVSI-1, HVSI-2, HVSL-1, HVSL-2, HPH and the cab-2 switchboard —
      for smoke, burning smell, fire, high temperature or any abnormality.
    gate: null
    abnormality_key: aux_abnormality_found
    on_abnormality: "Try to isolate the abnormal equipment."                         # §6.1.3(b)
    isolation:
      needs_history: isolation_successful
      on_isolated: "Reset the relay targets and resume traction."                    # §6.1.3(b)
      on_not_isolated: "Contact TLC."                                                # §6.1.3(b)
      source: "§6.1.3(b), p85–86"
    source: "§6.1.3(b), p85–86"

  - id: reset_decision
    text: "If everything is normal, reset the relay targets and resume traction."
    gate:
      type: reset_limit
      rule: >-
        If QLM drops a second time with other relays or alone — it re-locks after
        the first reset, or was already reset earlier this trip — DO NOT reset the
        relay target.
      needs_history: "was_QLM_reset_earlier_this_trip"
      recurrence_history: "fault_recurred"     # §6.1.3(d): "second time" = prior reset OR re-lock after first reset
      on_first_reset: >-
        Reset the relay targets and resume traction. Per §6.1.1 as applied by
        §6.1.3(a): check feeding-power-circuit items every 10 minutes, make a
        remark in the loco log book and inform TLC.
      on_already_reset: "DO NOT reset the relay target. Ask for a relief loco."
      source: "§6.1.3(c) reset; §6.1.3(d) second time forbidden; §6.1.3(a)→§6.1.1(d)(e), p86"

terminal_actions:
  no_abnormality:    "reset the relay targets; resume traction"                      # §6.1.3(c)
  # feeding-power-circuit abnormality: §6.1.3(a) → §6.1.1(f). (Aux-circuit abnormality is
  # the isolate-then-reset branch on check_auxiliary_power_circuit, §6.1.3(b).)
  abnormality_found: "do not reset the relay target; make a clear remark in the loco log book; inform TLC; ask for a relief loco"
  second_time:       "do not reset the relay target; ask for a relief loco"          # §6.1.3(d)

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.6, §6.1.3 (with §6.1.1 as referenced), pp.85–86"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
