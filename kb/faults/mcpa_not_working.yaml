# ─────────────────────────────────────────────────────────────────────────────
# Fault: MCPA (auxiliary compressor) not working
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 10 "Miscellaneous Failures", §10.01, p.162 (causes 1–3, a–g, Note).
# Mechanism: ladder. (a) is a STATED-ONLY branch (battery voltage reads '0' with no pilot
# lamps). (b) checks the battery voltage and ELICITS `battery_voltage_too_low`; the TSD's
# "there may be a partial dead cell, isolate the same as per the instructions 11.6" is wired
# as a ROUTE RULE to §11.06 (batch-4 §9.08(b) precedent), not re-worded here.
# Reached directly, or from §9.01 step 1 / §7.01.2(a) ("if MCPA is not working …").
# STATUS: encoded 2026-09-18 (batch 5) — structure approved by the user 2026-09-18.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: MCPA_not_working
aliases:
  - "MCPA not working"
  - "MCPA is not working"
  - "MCPA not running"
  - "MCPA does not run"
  - "MCPA not starting"
  - "MCPA does not start"
  - "auxiliary compressor not working"
  - "auxiliary compressor not running"
  - "CPA not working"
precedence: 1
listed_as: "miscellaneous failures (indication lamps, lights, horns, MCPA, panto)"
config_dependency: none
type_dependency: none
presenting_signs:
  - "MCPA does not work (less battery voltage, Addl. CCBA / CCBA fuse blown, or ZCPA and MCPA terminals disconnected)"

combination_rules: []
route_rules:
  - if_fact: battery_voltage_too_low
    equals: "yes"
    route_to: Isolation_of_defective_battery
    source: "§10.01(b), p162: 'If it is too low, there may be a partial dead cell. Isolate the same as per the instructions 11.6'"
    phrases: ["battery voltage is too low", "battery voltage too low", "BA voltage is too low",
              "battery is low", "voltage is very low", "partial dead cell", "dead cell"]

steps:
  # (a) — stated-only: battery voltage reads '0' and no pilot lamps
  - id: renew_addl_ccba_if_battery_reads_zero
    text: >-
      After HBA is 'ON', unlock BL: if the battery voltage reads '0' and all pilot lamps are
      not glowing, renew the Addl. CCBA fuse and try. (Addl. CCBA is provided in battery box
      No.1; some locos are provided with an MCB.)
    gate: null
    applies_when: {battery_voltage_zero: "yes"}
    requires_stated: true
    source: "§10.01(a), p162; §10.01 Note, p162"

  # (b)
  - id: switch_on_hba_zcpa_and_check_battery_voltage
    text: >-
      Switch on HBA and ZCPA and check the battery voltage. Report whether the battery
      voltage is too low.
    gate: null
    elicits: battery_voltage_too_low
    source: "§10.01(b), p162"

  # (c)
  - id: check_ccba_ltba_mov_if_voltage_above_90
    text: >-
      If the battery voltage is above 90 volts, check the fuse CCBA. If it is melted, check
      LTBA / MOV (remove and insulate the wire connection if any abnormality is found, as per
      the instructions of TLC), renew the fuse and resume traction. If it melts a second
      time, place HOBA in OFF, renew the fuse and resume traction.
    gate: null
    source: "§10.01(c), p162"

  # (d)
  - id: operate_zcpa_two_or_three_times
    text: >-
      If CCBA is in good condition, operate ZCPA 2 or 3 times (in some crew friendly cab
      locos ZCPA is provided in both cab LP desks) and check MCPA. If MCPA works, resume
      traction.
    gate: null
    source: "§10.01(d), p162"

  # (e)
  - id: check_zcpa_and_mcpa_terminals
    text: >-
      If MCPA does not work, check the terminals of ZCPA and MCPA. If any one is
      disconnected, connect the same and resume traction.
    gate: null
    source: "§10.01(e), p162"

  # (f)
  - id: tap_mcpa_on_commutator_end
    text: "If unsuccessful, gently tap MCPA on the commutator end and try."
    gate: null
    source: "§10.01(f), p162"

terminal_actions:
  resolved: "resume traction"
  unresolved: "contact TLC"                     # §10.01(g)

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.10, §10.01, p.162"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
