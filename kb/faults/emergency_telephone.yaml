# ─────────────────────────────────────────────────────────────────────────────
# Reference procedure: Emergency telephone
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 13, §13.09, p.203 (the location note and "How to use emergency telephone"
#         items 1–3).
# Mechanism: a REFERENCE PROCEDURE (batch 6) — three steps, used from §13.06 / §13.10 and
# §10.03 (contacting TPC for an emergency power block).
# STATUS: encoded 2026-09-18 (batch 6) — pending human confirmation.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: Emergency_telephone
aliases:
  - "emergency telephone"
  - "how to use the emergency telephone"
  - "emergency telephone tap"
  - "how to contact TPC"
  - "call TPC"
  - "where is the emergency telephone"
precedence: -1
listed_as: "isolation, wedging and special instructions"
config_dependency: none
type_dependency: none
presenting_signs:
  - "TPC has to be contacted from the section through an emergency telephone tap"

combination_rules: []
route_rules: []

steps:
  - id: find_the_nearest_telephone_tap
    text: >-
      Emergency telephone taps with sockets are provided at every one kilometre in the
      section; the location of the nearest telephone tap is indicated on the OHE mast by an
      arrow.
    gate: null
    source: "§13.09, p203"

  - id: open_the_tap_and_insert_the_portable_telephone_plug
    text: >-
      Open the emergency telephone tap with the key provided for the purpose and insert the
      plug of the portable telephone into the emergency telephone tap socket.
    gate: null
    source: "§13.09 'How to use emergency telephone' items 1–2, p203"

  - id: press_the_switches_and_call_out_to_tpc
    text: >-
      Press the switch provided on the portable handle and also the button on the side of the
      portable telephone box, then call out to TPC a number of times — 'Hello Emergency' — and
      give your message after TPC responds.
    gate: null
    completes: true
    source: "§13.09 'How to use emergency telephone' item 3, p203"

terminal_actions:
  resolved: "give the message to TPC and act on the instructions received"
  unresolved: "contact TLC"

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.13, §13.09, p.203"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
