# ─────────────────────────────────────────────────────────────────────────────
# Fault: QLA relay drops on run (auxiliary-circuit over-current relay, where provided)
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 6, §6.05 "QLA relay drops on run (if provided)", printed pp.100–101;
#         Notes 1–2 p.101.
# Mechanism: RESET-LIMIT gate, same shape as QLM §6.1.1: check the auxiliary circuit →
# abnormality: extinguishers + isolate → no abnormality: reset once → (d) "If QLA acts
# second time … whether there is any abnormality or not, do not reset the relay target,
# contact TLC for further instructions." The (f)(ii)-style second act is refused by the
# reflex on the prior-reset fact OR the engine's recurrence backstop. Note: the TSD does
# NOT say "relief loco" here — the on_already_reset text says TLC only.
# QLA with QLM acting → the QLM combination procedure (§6.1.3), by combination rule.
# STATUS: encoded 2026-09-16 (batch 1) — pending human confirmation.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: QLA_dropped
aliases:
  - "QLA dropped"
  - "QLA acted"
  - "QLA target dropped"
  - "QLA tripped"
  - "QLA drops on run"
  - "QLA locked"
config_dependency: none            # §6.05 lists the ARNO-build equipment; no SIV/ARNO branch stated
type_dependency: none
presenting_signs:
  - "DJ tripped"
  - "QLA red target dropped (auxiliary power circuit over-current)"

combination_rules:
  - if_also: ["QLM"]                 # §6.05 Note 1 "QLA may also drop along with QOA or QLM"; §6.1.3
    route_to: QLM_with_QLA_QOA
    source: "§6.05 Note 1, p101; §6.1.3 'QLM acted along with QLA/QOA', p85"

steps:
  # (a) (b)
  - id: check_aux_circuit_for_smoke_smell_fire
    text: >-
      Check the auxiliary power circuit equipment for any smoke, burning smell or fire
      in the a0, a1 terminals, ARNO and its capacitor bank, RCC panel, QCVAR, C118,
      R118, Q30, RQ30, UA1, UA2, CHBA, cab heaters, cab fans, TFVT, MVSI-1, MVSI-2,
      MVSL-1, MVSL-2, MPH, HVSI-1, HVSI-2, HPH, HVSL-1, HVSL-2, MVMT-1, MVMT-2, MVRH,
      MCP-1, MCP-2, MCP-3, AC MVRF, C101, C102, C103, C105, C106, C107, C108 (AC MVRF)
      and the MCP capacitor bank.
    gate: null
    abnormality_key: aux_abnormality_found
    on_abnormality: "Use fire extinguishers; isolate the abnormal equipment."           # §6.05(b)
    isolation:
      needs_history: isolation_successful
      on_isolated: "Try to resume traction."                                             # §6.05(b)
      on_not_isolated: "Contact TLC for further instructions."
      source: >-
        §6.05(b), p100 — states "use fire extinguishers, isolate the same and try to
        resume traction". The not-isolated branch is NOT stated here; INFERRED from
        §6.1.3(b) p85 ("otherwise contact TLC"), the QLA/QOA combination procedure.
    source: "§6.05(a)(b), p100"

  # (c) + (d): the one permitted reset and the second-act refusal.
  - id: reset_qla
    text: "If no abnormality is noticed in any equipment, reset QLA and resume traction."
    gate:
      type: reset_limit
      rule: >-
        QLA may be reset only once. If QLA acts a second time — it re-locks after the
        first reset, or was already reset earlier this trip — check the auxiliary power
        circuit equipment, and whether or not any abnormality is found, DO NOT reset the
        relay target; contact TLC for further instructions.
      needs_history: "was_QLA_reset_earlier_this_trip"
      recurrence_history: "fault_recurred"
      on_first_reset: "Reset QLA and resume traction."
      after_first_reset: "Resume traction."
      on_already_reset: >-
        QLA has acted a second time. Check the auxiliary power circuit equipment for any
        abnormality; whether there is any abnormality or not, DO NOT reset the relay
        target. Contact TLC for further instructions.
      source: "§6.05(c) reset; §6.05(d) second time forbidden, pp100–101"
    source: "§6.05(c)(d), pp100–101"

terminal_actions:
  no_abnormality:    "reset QLA once; resume traction"                                  # §6.05(c)
  abnormality_found: "use fire extinguishers; isolate the abnormal equipment; try to resume traction"   # §6.05(b)
  second_time:       "do not reset the relay target; contact TLC for further instructions"              # §6.05(d)

# Note 2, p.101: "QLA mechanical locking is provided in some locos" — recorded, not a step.
source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.6, §6.05, pp.100–101"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
