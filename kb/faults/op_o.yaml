# ─────────────────────────────────────────────────────────────────────────────
# Fault: Operation 'O'
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 7, §7.07 "Operation 'O'", pp.120–121 (abnormal sign, causes 1–3, trouble
#         shooting 1–3 and the blower-isolation paragraphs, then the switch tests 1–4).
# Mechanism: ISOLATE-BY-ELIMINATION ladder on MVRH / MVMT-1 / MVMT-2 (HVRH, HVMT-1, HVMT-2 on
# 3, 30-second waits). A blower not working → isolate and work on (completes); MVRH not
# working also offers "clear the block section within 5 notches OR wedge Q118" — the wedge
# is a hazard_exposure gate (§7.01.3 precautions), stated-only.
# STATUS: encoded 2026-09-16 (batch 2) — pending human confirmation.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: Op_O
aliases:
  - "operation O"
  - "operation 'O'"
  - "op O"
  - "trips after closing BLVMT"
  - "DJ trips on closing BLVMT"
  - "trips within 30 seconds of BLVMT"
precedence: 1
confirm_before_guidance: true
listed_as: "DJ tripping failures (no tension / operations A-B-O-I-II / TWAC)"
config_dependency: none
type_dependency: none
presenting_signs:
  - "After closing DJ, wait for 15 sec, close BLVMT: while counting 30 sec, LSDJ re-glows (DJ trips)"

combination_rules: []
route_rules: []

steps:
  # 1
  - id: check_mvmt_mvrh_for_smell_smoke_fire
    text: >-
      Check for any smell, smoke or fire from MVMT-1, MVMT-2 and MVRH; if any, use the fire
      extinguishers and work with precautions.
    gate: null
    source: "§7.07 item 1, p120"

  # 2
  - id: hvrh_hvmt_on_3_close_dj_blvmt_wait_30s
    text: >-
      If there is no abnormality, place HVRH, HVMT-1 and HVMT-2 on the '3' position. Close
      DJ, close BLVMT and wait for 30 seconds. If DJ holds, check the working of MVRH,
      MVMT-1 and MVMT-2. Report which blowers are working.
    gate: null
    source: "§7.07 item 2, pp120–121"

  # 3 — MVRH
  - id: mvrh_not_working_hvrh_on_0_restricted_current
    text: >-
      If MVRH is not working: trip DJ, place HVRH on '0', ensure C107 is fully open and
      work up to the next station with 920 A for the first 5 min and then 500 A continuous
      current rating. Switch ON BLVMT and check C105 & C106 are closed. If they are closed,
      clear the block section within 5 notches, or wedge Q118 in the energised condition
      (with the precautions for wedging Q118) and clear the block section.
    gate: null
    applies_when: {mvrh_working: "no"}
    requires_stated: true
    completes: true
    source: "§7.07 item 3 and the MVRH paragraph, p121"

  - id: wedge_q118_to_clear_section_with_mvrh_isolated
    text: >-
      With MVRH isolated (HVRH on '0'), wedge Q118 in the energised condition and clear
      the block section, observing the precautions for wedging Q118: all EM contactors
      opened before wedging; after closing DJ ensure C118 is fully opened; check MVMT1,
      MVMT2, MVRH, MVSL1, MVSL2 frequently; check the TFR oil level; avoid quick regression
      of GR.
    gate:
      type: hazard_exposure
      rule: >-
        Do not wedge Q118 unless all EM contactors are opened (precautions for wedging
        Q118, §7.01.3).
      action: wedge_Q118
      preconditions:
        - all_em_contactors_open
      on_precondition_unmet: >-
        Before wedging Q118, ensure all EM contactors are opened. Then, with Q118 wedged in
        the energised condition: after closing DJ ensure C118 is fully opened; check the
        working of MVMT1, MVMT2, MVRH, MVSL1, MVSL2 auxiliaries frequently; check the TFR
        oil level for any colour change or any abnormal increase of oil level; avoid quick
        regression of GR.
      precondition_question: "Before wedging Q118, were all EM contactors opened?"
      source: "§7.01.3 Precautions for wedging Q118 (a)–(e), p106; §7.07 MVRH paragraph, p121"
    applies_when: {mvrh_working: "no"}
    requires_stated: true
    completes: true
    source: "§7.07 MVRH paragraph, p121"

  # 3 — MVMT-1 / MVMT-2
  - id: mvmt1_not_working_isolate_and_work_50pc
    text: >-
      If MVMT-1 is not working: trip DJ, place HVMT-1, HVSI-1 and HVSL-1 on '0', ensure
      C105 is fully open and work onwards with 50% of the maximum load permitted.
    gate: null
    applies_when: {mvmt1_working: "no"}
    requires_stated: true
    completes: true
    source: "§7.07 item 3 and the MVMT-1 paragraph, p121"

  - id: mvmt2_not_working_isolate_and_work_50pc
    text: >-
      If MVMT-2 is not working: trip DJ, place HVMT-2, HVSI-2 & HVSL-2 on '0', ensure C106
      is fully open and work onwards with 50% of the maximum permissible load. Inform TLC.
    gate: null
    applies_when: {mvmt2_working: "no"}
    requires_stated: true
    completes: true
    source: "§7.07 item 3 and the MVMT-2 paragraph, p121"

  # switch tests 1–4
  - id: clear_section_with_all_blowers_working
    text: >-
      If all the 3 blowers are working normally with HVRH, HVMT-1 and HVMT-2 on '3', clear
      the block section.
    gate: null
    source: "§7.07 switch test 1, p121"

  - id: test_hvrh_on_1
    text: >-
      Trip DJ, place HVRH on '1', close DJ, close BLVMT and wait for 30 seconds. Report
      whether DJ trips or holds.
    gate: null
    source: "§7.07 switch test 2, p121"

  - id: qvrh_defective_hvrh_on_3
    text: >-
      If DJ trips with HVRH on '1', QVRH is defective: place HVRH on '3' and the other two
      switches on '1', and work further duly watching the MVRH blower working frequently.
    gate: null
    applies_when: {dj_trips_with_hvrh_on_1: "yes"}
    completes: true
    source: "§7.07 switch test 2, p121"

  - id: test_hvmt1_on_1
    text: >-
      If DJ holds with HVRH on '1', trip DJ, place HVMT-1 on '1', close DJ, close BLVMT and
      wait for 30 seconds. Report whether DJ trips or holds.
    gate: null
    applies_when: {dj_trips_with_hvrh_on_1: "no"}
    source: "§7.07 switch test 3, p121"

  - id: qvmt1_defective_hvmt1_on_3
    text: >-
      If DJ trips with HVMT-1 on '1', QVMT-1 is defective: place HVMT-1 on '3' and HVMT-2
      on '1', and work further duly watching the working of MVMT1 frequently.
    gate: null
    applies_when: {dj_trips_with_hvmt1_on_1: "yes"}
    completes: true
    source: "§7.07 switch test 3, p121"

  - id: qvmt2_defective_hvmt2_on_3
    text: >-
      If DJ holds with HVMT-1 on '1', it indicates QVMT-2 is defective: keep HVMT-2 on '3'
      and work further duly watching the MVMT-2 blower working frequently.
    gate: null
    applies_when: {dj_trips_with_hvmt1_on_1: "no"}
    completes: true
    source: "§7.07 switch test 4, p121"

terminal_actions:
  resolved: >-
    work further with the identified switch on '3' (or the blower isolated on '0' with its
    load / current restriction), watching the concerned blower frequently
  unresolved: "contact TLC for advice"

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.7, §7.07, pp.120–121"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
