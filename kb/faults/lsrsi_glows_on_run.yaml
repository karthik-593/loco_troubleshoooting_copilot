# ─────────────────────────────────────────────────────────────────────────────
# Fault: LSRSI glows on run
# SOURCE: SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019),
#         Chapter 10 "Miscellaneous Failures", §10.08, pp.170–171 (causes 1–3, a–g, Note).
# Mechanism (approved batch 5 decision 1): (b) ELICITS `telltale_fuses_melted` — how many
# tell-tale fuses are melted and where — and (c) / (d) / (e) / (f) are its four branches.
# Removing a melted tell-tale fuse from an RSI block carries a HAZARD-EXPOSURE gate: §10.08
# states the de-energising as a BEFORE condition of the removal ("open DJ, lower pantograph,
# switch off HBA duly closing IP(M) coc, remove the melted fuse"), so a removal claimed on a
# live loco is refused. Intent `remove_telltale_fuse`.
# STATUS: encoded 2026-09-18 (batch 5) — structure approved by the user 2026-09-18.
# ─────────────────────────────────────────────────────────────────────────────
fault_id: LSRSI_glows_on_run
aliases:
  - "LSRSI glows on run"
  - "LSRSI glowing on run"
  - "LSRSI is glowing"
  - "LSRSI glows"
  - "LSRSI glowing"
  - "tell tale fuse melted"
  - "telltale fuse melted"
  - "tell tale fuse blown"
  - "RSI tell tale fuse melted"
precedence: 1
listed_as: "miscellaneous failures (indication lamps, lights, horns, MCPA, panto)"
config_dependency: none
type_dependency: none
presenting_signs:
  - "LSRSI glows on run (a tell-tale fuse melted / LED glowing on an RSI block, a QV63 N/O interlock welded, or a BPT contact stuck up)"

combination_rules: []
route_rules: []

steps:
  # (a)
  - id: note_meter_readings_and_notches
    text: >-
      Note the reading of the traction motor ammeters, the voltmeter, the UA meter, the
      traction notch and the shunting notch if any.
    gate: null
    source: "§10.08(a), p170"

  # (b)
  - id: coast_and_check_telltale_fuses_on_both_rsi_blocks
    text: >-
      Bring MP to '0' and try to clear the block section by coasting; check the tell-tale
      fuses on both RSI blocks. Report how many tell-tale fuses are melted and in which RSI
      block. (When a tell-tale fuse is blown, a red plunger projects from the fuse and LSRSI
      glows on the driver's desk; in some locos LEDs are provided in place of the tell-tale
      projection.)
    gate: null
    elicits: telltale_fuses_melted
    source: "§10.08(b), p170; §10.08 Note, p171"

  # (c) — one tell-tale fuse melted in one RSI block
  - id: remove_fuse_if_one_melted_in_one_block
    text: >-
      Remove the melted fuse and work without reaching the previous current ratings.
    applies_when: {telltale_fuses_melted: one_in_one_block}
    completes: true
    gate:
      type: hazard_exposure
      rule: >-
        Do not remove a melted tell-tale fuse from an RSI block until the loco is
        de-energised: DJ opened, pantograph lowered and HBA switched off duly closing the
        IP(M) coc.
      action: remove_fuse
      preconditions:
        - dj_opened
        - panto_lowered
        - hba_off_with_ip_coc_closed
      on_precondition_unmet: >-
        Do not remove the melted tell-tale fuse yet: open DJ, lower the pantograph and switch
        off HBA duly closing the IP(M) coc first.
      precondition_question: >-
        Before removing the fuse: is DJ opened, the pantograph lowered and HBA switched off
        with the IP(M) coc closed?
      source: "§10.08(c), p170"
    source: "§10.08(c), p170"

  # (d) — two or more in the same RSI block
  - id: remove_fuses_and_isolate_truck_if_two_or_more_in_same_block
    text: >-
      Remove the melted fuses. Isolate the concerned truck by placing the concerned HVSI,
      HVMT and HVSL on '0' and work with 50% of the maximum permissible load.
    applies_when: {telltale_fuses_melted: two_or_more_same_block}
    completes: true
    gate:
      type: hazard_exposure
      rule: >-
        Do not remove a melted tell-tale fuse from an RSI block until the loco is
        de-energised: DJ opened, pantograph lowered and HBA switched off.
      action: remove_fuse
      preconditions:
        - dj_opened
        - panto_lowered
        - hba_off_with_ip_coc_closed
      on_precondition_unmet: >-
        Do not remove the melted tell-tale fuses yet: open DJ, lower the pantograph and
        switch off HBA first.
      precondition_question: >-
        Before removing the fuses: is DJ opened, the pantograph lowered and HBA switched off?
      source: "§10.08(d), p171"
    source: "§10.08(d), p171"

  # (e) — one on each RSI block
  - id: remove_fuses_from_both_blocks_if_one_in_each
    text: >-
      Remove the melted fuses from both RSI blocks and work further without exceeding the
      previous voltage and current ratings.
    applies_when: {telltale_fuses_melted: one_in_each_block}
    completes: true
    gate:
      type: hazard_exposure
      rule: >-
        Do not remove a melted tell-tale fuse from an RSI block until the loco is
        de-energised: DJ opened, pantograph lowered and HBA switched off.
      action: remove_fuse
      preconditions:
        - dj_opened
        - panto_lowered
        - hba_off_with_ip_coc_closed
      on_precondition_unmet: >-
        Do not remove the melted tell-tale fuses yet: open DJ, lower the pantograph and
        switch off HBA first.
      precondition_question: >-
        Before removing the fuses: is DJ opened, the pantograph lowered and HBA switched off?
      source: "§10.08(e), p171"
    source: "§10.08(e), p171"

  # (f) — none melted
  - id: check_telltale_positions_micro_switches_qv63_and_bpt
    text: >-
      If no tell-tale fuse is melted, check minutely the positions of the tell-tale fuses and
      the micro switches. If they are normal, check the QV63 N/O interlock and the BPT
      contact for proper opening.
    gate: null
    applies_when: {telltale_fuses_melted: none}
    source: "§10.08(f), p171"

  # (g)
  - id: ignore_lsrsi_and_clear_section_checking_fuses
    text: >-
      If everything is normal, ignore LSRSI and clear the block section, duly checking the
      tell-tale fuses at frequent intervals for any abnormality. After clearing the block
      section, contact TLC for advice.
    gate: null
    applies_when: {telltale_fuses_melted: none}
    completes: true
    source: "§10.08(g), p171"

terminal_actions:
  resolved: "work onwards within the stated current / voltage limits and contact TLC after clearing the block section"
  unresolved: "contact TLC for advice"

source: "SCR/ETTC Operating Manual & Trouble Shooting Directory (Rev-2, 2019), Ch.10, §10.08, pp.170–171"
source_url: "https://scr.indianrailways.gov.in/cris//uploads/files/1566969531009-ETTC_TSD.pdf"
