- text: "isolated TM5, running with reduced load"
  state_fault: QRSI2_drops_on_run
  last_assistant: "Have you isolated that traction motor and set your load to 5/6 of the maximum permissible?"
  fault: QRSI2_drops_on_run
  claimed: [isolate_tm_of_bad_hmcs2_position]
