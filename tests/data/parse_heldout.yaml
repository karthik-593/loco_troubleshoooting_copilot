# Held-out free-text parse set (BUILD_PLAN §14 M2 DoD). Messy pilot messages → expected
# structured fields. Expected values use KB vocabulary only. Run by tests/test_parse_live.py
# against the real model when credentials are available; skipped otherwise.
# Fields not listed are not asserted.
- text: "QLM locked. I checked the transformer and oil level."
  fault: QLM_dropped
  claimed: [check_ht2_compartment, check_oil_levels]
- text: "dj tripped, qlm target down. ht2 checked no smoke no smell, oil ok. going to reset now"
  fault: QLM_dropped
  claimed: [check_ht2_compartment, check_oil_levels]
  abnormality: "no"
  intended_action: reset_QLM
- text: "QLM red. already reset once this trip near the last station"
  fault: QLM_dropped
  reset_earlier: "yes"
- text: "qlm acted first time, not reset before. checked ht2 compartment, tfp oil, gr oil, cgr arc chutes, all normal"
  fault: QLM_dropped
  claimed: [check_ht2_compartment, check_oil_levels, check_arc_chutes_and_terminals]
  reset_earlier: "no"
  abnormality: "no"
- text: "QLM locked and QOP-1 also dropped"
  fault: QLM_dropped
  other_relays: [QOP-1]
- text: "qlm dropped, smoke coming from HT2 side"
  fault: QLM_dropped
  abnormality: "yes"      # whether this also counts as 'checked HT-2' is ambiguous; the engine
                          # REFUSES on abnormality either way, so the claim is not asserted
- text: "vcb tripped, qlm locked indication, along with QLA"
  fault: QLM_dropped
  other_relays: [QLA]
- text: "sanders not working on both sides"
  fault: sanders_not_working
- text: "dj tripped, dont know which relay"
  fault_confidence_below: 0.6
- text: "QLM dropped. checked the horn and the headlight, both fine"
  fault: QLM_dropped
  claimed: []
  unmapped_min: 1
# --- M4a: combination faults + sanders ---
- text: "sanders not working. pressed pedal, sander COCs were closed, opened them, sanding now"
  fault: sanders_not_working
  claimed: [check_psa_and_sander_cocs]
  resolved: "yes"
- text: "no sand coming out even with PSA pressed, cocs are open, LSP and LSRSI both glowing"
  fault: sanders_not_working
  claimed: [check_psa_and_sander_cocs, check_lamps_and_ccls]
- text: "QLM locked with QOP-1. feeding circuit all ok. traction circuit RSI-1 smoking, isolated it successfully"
  fault_any_of: [QLM_dropped, QLM_with_QOP_QRSI]      # alias → QLM_dropped + relays, or a direct guess
  abnormality: "no"
  facts: {traction_abnormality_found: "yes", isolation_successful: "yes"}
- text: "qlm and qla dropped together. arno side burning smell, could not isolate"
  fault_any_of: [QLM_dropped, QLM_with_QLA_QOA]
  facts: {aux_abnormality_found: "yes", isolation_successful: "no"}
# --- M4b: pantograph hazard + QRSI-1 ladder ---
- text: "panto damaged by OHE, lowered it with ZPT 0, BP is fine, called TPC for power block. climbing on roof now"
  fault: pantograph_damaged
  claimed: [lower_pantograph_immediately, check_bp_and_protect_train, obtain_emergency_power_block]
  intended_action: work_on_roof
- text: "TPC gave power block, OHE staff earthed the wire both sides, I grounded loco with HOM"
  fault_any_of: [pantograph_damaged]
  facts: {ohe_power_block_obtained_and_earthed: "yes", loco_grounded: "yes"}
  allow_clarify_if_no_fault: true
- text: "QRSI-1 dropped on run. checked RSI-1 and TMs all normal. reset, dropped again after 2 min. tried HMCS-1 positions, drops only in position 2"
  fault: QRSI1_drops_on_run
  claimed: [check_traction_circuit_1, reset_and_accelerate_gradually, try_hmcs1_positions_if_frequent]
  facts: {drops_frequently: "yes", drops_in_particular_hmcs1_position: "yes"}
- text: "QRSI-1 target dropped. SL-1 burning, tried to isolate but couldn't"
  fault: QRSI1_drops_on_run
  facts: {traction1_abnormality_found: "yes", isolation_successful: "no"}
# --- M6-optional: QRSI-2 + fire_on_loco ---
- text: "QRSI-2 target dropped on run. checked RSI-2, TM4 5 6, SL-2 all normal. reset, dropped again in 3 minutes. tried HMCS-2 in 2,3,4, drops in all positions"
  fault: QRSI2_drops_on_run
  claimed: [check_traction_circuit_2, reset_and_accelerate_gradually, try_hmcs2_positions_if_frequent]
- text: "smoke coming from the machine room near the aux compressor"
  fault: fire_on_loco
- text: "opened DJ, panto down, HBA off, flasher on, train stopped. got the extinguisher there"
  fault_any_of: [fire_on_loco]
  claimed: [open_dj_lower_panto_hba_off_flasher_stop, take_extinguisher_to_equipment]
  allow_clarify_if_no_fault: true
# --- §5.6 out-of-scope: a concrete problem that is not in the procedure set ---
- text: "my headlight is not working. i am going at normal speed. is there any issue?"
  out_of_scope: true
- text: "no traction suddenly. no relays dropped, loco just stopped"
  never_acts: true            # borderline: clarify once or defer; never a procedure
- text: "qop dropped"
  never_acts: true            # QOP alone is not encoded (only QLM with QOP/QRSI); the relay IS in the vocabulary
# --- one reset reported in the first message is the gated step, NOT a prior reset ---
- text: "qlm dropped , i resetted, now working fine"
  fault: QLM_dropped
  claimed: [reset_decision]
  reset_earlier_not: "yes"    # unknown (or no) — never a prior reset from this sentence alone
  resolved: "yes"
- text: "no, only once"
  state_fault: QLM_dropped
  last_assistant: "Before the reset you just did, had QLM been reset earlier this trip? Check the loco log book."
  fault: QLM_dropped
  reset_earlier: "no"
- text: "yes, once before near the last station"
  state_fault: QLM_dropped
  last_assistant: "Before the reset you just did, had QLM been reset earlier this trip? Check the loco log book."
  fault: QLM_dropped
  reset_earlier: "yes"
