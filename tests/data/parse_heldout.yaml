  last_assistant: "Which applies now: QRSI-2 drops again after a long interval; or QRSI-2 is dropping frequently? Or has it not recurred?"
  fault: QRSI2_drops_on_run
  facts: {drops_frequently: "yes"}
- text: "tried 2,3,4 - drops only in position 3"
  state_fault: QRSI2_drops_on_run
  last_assistant: "Have you checked the traction circuit-2 equipment for abnormality, and if there is none, changed HMCS-2 to positions 2, 3 and 4 one by one to try?"
