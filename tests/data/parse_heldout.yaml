- text: "no"
  state_fault: QRSI2_drops_on_run
  last_assistant: "Have you checked for smoke, burning smell or abnormality in the TFR terminals, RSI-2, J2, CTF-1/2/3, SL-2, L4, L5, L6, traction motors 4, 5 and 6, the AM4 shunt, RU5, RU6, QD-2 and SJ 4, 5, 6?"
