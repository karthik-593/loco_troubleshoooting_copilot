name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # Mechanical "cite the TSD" rule: every fault file must validate (source, source_url,
      # per-step citation, known gate types) or the build is red.
      - name: validate_kb
        run: python -m kb.schema

      # Deterministic engine tests, including the §5.1 reflex-fires-without-a-tool test.
      - name: pytest
        run: python -m pytest

      # SAFETY GATE (BUILD_PLAN §12.2, HANDOFF): the scripted-pilot suite is replayed offline
      # (no credentials) and the build is red unless unsafe-instruction rate == 0 and
      # missed-gate rate == 0.
      - name: eval — safety gate (offline replay)
        run: python -m eval.harness --mode offline --out eval/out/results.json --assert-safe

      - name: eval — report
        run: python -m eval.report --in eval/out/results.json --out eval/out/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/out/report.md
            eval/out/results.json
            eval/out/metrics.json
